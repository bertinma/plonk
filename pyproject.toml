[tool.poetry]
name = "plonk"
package-mode = true
version = "0.1.0"
description = ""
# authors = [{ name = "marc-antoine", email = "marcantoine.bertin@storyzy.com" }]
readme = "README.md"

[tool.poetry.dependencies]
python = "==3.14.*"
scikit-learn = ">=1.8.0,<2.0.0"
pandas = ">=2.0.3,<3.0.0"
joblib = ">=1.5.3,<2.0.0"
hydra-core = ">=1.3.2,<2.0.0"
numpy = ">=2.4.4,<3.0.0"
scipy = ">=1.17.1,<2.0.0"
pytorch-lightning = ">=2.6.1,<3.0.0"
transformers = ">=5.5.3,<6.0.0"
accelerate = ">=1.13.0,<2.0.0"
peft = ">=0.18.1,<0.19.0"
geos = ">=0.2.3,<0.3.0"
reverse-geocoder = ">=1.5.1,<2.0.0"
matplotlib = ">=3.10.8,<4.0.0"
geoopt = ">=0.5.1,<0.6.0"
einops = ">=0.8.2,<0.9.0"
torchdiffeq = ">=0.2.5,<0.3.0"
webdataset = "==0.2.57"
torch = { version = "2.10.0+cu129", source = "torch_cuda129" }
torchvision = { version = "0.25.0+cu129", source = "torch_cuda129" }
torchaudio = { version = "2.10.0+cu129", source = "torch_cuda129" }
wandb = "^0.25.1"
mlflow = "^3.12.0"
lightning = "^2.6.1"


[tool.poetry.group.dev.dependencies]
black = "^26.3.1"
isort = "^8.0.1"

[[tool.poetry.source]]
name = "torch_cuda129"
url = "https://download.pytorch.org/whl/cu129"
priority = "explicit"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
skip-string-normalization = true

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 120
